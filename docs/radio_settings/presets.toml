# docs/radio_settings/presets.toml
# Machine-readable radio presets for NodeBot installers.
#
# lxmf.presets  — loaded by install_lxmf.sh
#   Units: freq_hz (integer Hz), bw_hz (integer Hz), sf (integer)
#   Source: https://github.com/markqvist/Reticulum/wiki/Popular-RNode-Settings
#
# meshcore.presets — loaded by install_meshcore.sh
#   Units: freq_mhz (float MHz), bw_khz (float kHz), sf (integer), cr (integer)
#   Source: MeshCore community defaults — docs/radio_settings/meshcore.md
#
# Human-readable reference: docs/radio_settings/{reticulum_rnode,meshcore,meshtastic}.md
# =============================================================================


