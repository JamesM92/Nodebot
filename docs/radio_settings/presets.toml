# ── Meshtastic ────────────────────────────────────────────────────────────────
# NOTE: install_meshtastic.sh does NOT load from this section.
# Meshtastic uses firmware-managed regions and presets — the installer passes
# region/preset code strings to the Meshtastic API; the firmware computes all
# radio parameters internally.
#
# This section is provided as a cross-protocol reference only.
# Full channel frequency formula and per-region slot tables: meshtastic.md

# Modem presets — fixed parameters, apply in all regions
# Source: https://github.com/meshtastic/firmware/blob/master/src/mesh/RadioInterface.cpp
[[meshtastic.presets]]
code        = "SHORT_TURBO"
sf          = 7
bw_khz      = 500
cr          = "4/5"
symbol_time_ms = 0.26
data_rate_kbps = 21.88
notes       = "Not legal in all regions (500 kHz BW)"

[[meshtastic.presets]]
code        = "SHORT_FAST"
sf          = 7
bw_khz      = 250
cr          = "4/5"
symbol_time_ms = 0.51
data_rate_kbps = 10.94

[[meshtastic.presets]]
code        = "SHORT_SLOW"
sf          = 8
bw_khz      = 250
cr          = "4/5"
symbol_time_ms = 1.02
data_rate_kbps = 6.25

[[meshtastic.presets]]
code        = "MEDIUM_FAST"
sf          = 9
bw_khz      = 250
cr          = "4/5"
symbol_time_ms = 2.05
data_rate_kbps = 3.52

[[meshtastic.presets]]
code        = "MEDIUM_SLOW"
sf          = 10
bw_khz      = 250
cr          = "4/5"
symbol_time_ms = 4.10
data_rate_kbps = 1.95

[[meshtastic.presets]]
code        = "LONG_TURBO"
sf          = 11
bw_khz      = 500
cr          = "4/8"
symbol_time_ms = 4.10
data_rate_kbps = 1.34

[[meshtastic.presets]]
code        = "LONG_FAST"
sf          = 11
bw_khz      = 250
cr          = "4/5"
symbol_time_ms = 8.19
data_rate_kbps = 1.07
default     = true
notes       = "Firmware default — good balance of speed and range"

[[meshtastic.presets]]
code        = "LONG_MODERATE"
sf          = 11
bw_khz      = 125
cr          = "4/8"
symbol_time_ms = 16.38
data_rate_kbps = 0.34

[[meshtastic.presets]]
code        = "LONG_SLOW"
sf          = 12
bw_khz      = 125
cr          = "4/8"
symbol_time_ms = 32.77
data_rate_kbps = 0.18

[[meshtastic.presets]]
code        = "VERY_LONG_SLOW"
sf          = 12
bw_khz      = 62.5
cr          = "4/8"
symbol_time_ms = 65.54
data_rate_kbps = 0.09
notes       = "Max range, very slow — not recommended for general use"

