name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Syntax check (all .py files)
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./.git/*" \
            | xargs python -m py_compile

      - name: Shell script syntax check
        run: |
          find . -name "*.sh" \
            -not -path "./.git/*" \
            | xargs -I{} bash -n {}
